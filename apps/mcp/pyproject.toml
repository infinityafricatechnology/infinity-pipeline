[project]
name = "infinity-pipeline-mcp"
version = "0.1.0"
description = "Serveur MCP qui permet à Claude de consulter et de mettre à jour Infinity Pipeline par son API publique"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.0",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "respx>=0.22,<1",
    "ruff>=0.16,<1",
]

[project.scripts]
infinity-pipeline-mcp = "pipeline_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
